---
- name: SW2 - porter til begge rutere og SW3
  hosts: SW2
  gather_facts: false
  tasks:
    - ansible.builtin.import_tasks: _validate.yml
    - name: Opprett VLAN 10,20,99
      cisco.ios.ios_config:
        parents: 'vlan {{ item.id }}'
        lines:
          - 'name {{ item.name }}'
      loop:
        - { id: 10, name: STUD1 }
        - { id: 20, name: STUD2 }
        - { id: 99, name: MANAGEMENT }
    - name: Trunk Fa0/1 og Fa0/2 mot rutere (10 og 99)
      cisco.ios.ios_config:
        parents: 'interface {{ item }}'
        lines:
          - switchport mode trunk
          - 'switchport trunk allowed vlan {{ vlan.stud1 }},{{ vlan.mgmt }}'
          - no shutdown
      loop:
        - '{{ ports.sw2_r1 }}'
        - '{{ ports.sw2_r2 }}'
    - name: Trunk Fa0/3 til SW3 (10,20,99)
      cisco.ios.ios_config:
        parents: 'interface {{ ports.sw2_sw3 }}'
        lines:
          - description TO_SW3
          - switchport mode trunk
          - 'switchport trunk allowed vlan {{ vlan.stud1 }},{{ vlan.stud2 }},{{ vlan.mgmt }}'
          - no shutdown
    - name: Sørg for management gateway
      cisco.ios.ios_config:
        lines:
          - 'ip default-gateway {{ ip.sw_down_gateway }}'
    # Vlan99 IP er allerede konfigurert av SSH-scriptet.
