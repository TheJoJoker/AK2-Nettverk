all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: cisco
    ansible_become: true
    ansible_become_method: enable
  children:
    switches:
      hosts:
        SW1:
          ansible_host: 192.168.99.11
        SW2:
          ansible_host: 192.168.98.12
        SW3:
          ansible_host: 192.168.98.13
    routers:
      hosts:
        R1:
          ansible_host: 192.168.99.2
        R2:
          ansible_host: 192.168.99.3
